name: todo_app
description: Personal study workspace with tasks, assignments, milestones, subjects, notes and cross-device sync.
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  flutter_markdown: ^0.7.7
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  google_identity_services_web: ^0.3.3+1
  googleapis: ^15.0.0
  googleapis_auth: ^1.6.0
  http: ^1.2.2
  intl: ^0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  table_calendar: ^3.1.3
  uuid: ^4.5.1
  flutter_quill: ^11.6.0

dev_dependencies:
  fake_cloud_firestore: ^4.3.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - shaders/liquid_glass.frag
    - assets/logo.png
